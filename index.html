<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatrice</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calcolatrice</h1>
    <div id="schermo">
        <div id="risposta"></div>
        <div id="input"></div>
    </div>
    <!--SPAZIO PER PER PULSANTI-->
    <div id="pulsanti">
        <table>
            <tr>
                <td><button onclick="n(7)" >7</button></td>
                <td><button onclick="n(8)" >8</button></td>
                <td><button onclick="n(9)" >9</button></td>
                <td><button onclick="operazione('somma')">+</button></td>
                <td><button onclick="operazione('divisione')">&divide</button></td>
            </tr>
            <tr>
                <td><button onclick="n(4)">4</button></td>
                <td><button onclick="n(5)">5</button></td>
                <td><button onclick="n(6)">6</button></td>
                <td><button onclick="operazione('sottrazione')">-</button></td>
                <td><button onclick="operazione('potenza')">^</button></td>
            </tr>
            <tr>
                <td><button onclick="n(1)">1</button></td>
                <td><button onclick="n(2)">2</button></td>
                <td><button onclick="n(3)">3</button></td>
                <td><button onclick="operazione('moltiplicazione')">x</button></td>
                <td><button onclick="operazione('radice')">&#x221A</button></td>
            </tr>
            <tr>
                <td><button onclick="n(0)">0</button></td>
                <td><button onclick="cancella()">&#x2297</button></td>
                <td><button onclick="uguale()">=</button></td>
            </tr>
    </table>
        <!--bisogna mettere uno spazio per visualizzare il risultato del calcolo-->
    </div>
</body>
</html>
